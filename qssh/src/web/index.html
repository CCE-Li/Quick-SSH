<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>qssh · AI Agent WebUI</title>
<style>
:root {
  --bg: #0f1420;
  --bg-panel: #161d2e;
  --bg-hover: #1d2740;
  --border: #26314d;
  --text: #dbe4f5;
  --text-dim: #8a97b5;
  --accent: #4f8cff;
  --accent-soft: rgba(79, 140, 255, 0.14);
  --green: #3ddc97;
  --yellow: #f5c542;
  --red: #ff5c6c;
  --radius: 10px;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px; overflow: hidden;
}
#app { display: flex; flex-direction: column; height: 100vh; }
header {
  display: flex; align-items: center; gap: 14px; padding: 10px 18px;
  background: var(--bg-panel); border-bottom: 1px solid var(--border);
}
.logo { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.logo .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
.logo span { color: var(--accent); }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--text-dim); }
.badge {
  padding: 3px 10px; border-radius: 20px; font-size: 12px;
  background: var(--accent-soft); color: var(--accent); border: 1px solid transparent;
}
.badge.ok { background: rgba(61,220,151,0.12); color: var(--green); border-color: rgba(61,220,151,0.3); }
.badge.err { background: rgba(255,92,108,0.12); color: var(--red); border-color: rgba(255,92,108,0.3); }
.badge.warn { background: rgba(245,197,66,0.12); color: var(--yellow); border-color: rgba(245,197,66,0.3); }
main { flex: 1; display: flex; min-height: 0; }
aside {
  width: 260px; background: var(--bg-panel); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; min-height: 0;
}
.panel-title { padding: 12px 14px 6px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); font-weight: 600; }
section#chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.host-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
.host-item {
  padding: 8px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 2px;
  border: 1px solid transparent; transition: background 0.15s, border-color 0.15s;
}
.host-item:hover { background: var(--bg-hover); }
.host-item.active { background: var(--accent-soft); border-color: rgba(79,140,255,0.4); }
.host-item .name { font-weight: 600; font-size: 13px; }
.host-item .sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; font-family: var(--mono); }
.host-empty { padding: 20px 14px; color: var(--text-dim); font-size: 12px; line-height: 1.8; }
#messages { flex: 1; overflow-y: auto; padding: 18px 22px; scroll-behavior: smooth; }
.msg { display: flex; margin-bottom: 16px; }
.msg .avatar {
  width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 13px;
  background: var(--bg-hover); color: var(--text-dim);
}
.msg.user { justify-content: flex-end; }
.msg.user .avatar { order: 2; margin-left: 10px; background: var(--accent-soft); color: var(--accent); }
.msg.assistant .avatar { margin-right: 10px; background: rgba(61,220,151,0.12); color: var(--green); }
.msg .bubble {
  max-width: 72%; padding: 10px 14px; border-radius: var(--radius);
  background: var(--bg-panel); border: 1px solid var(--border); line-height: 1.6;
  white-space: pre-wrap; word-break: break-word;
}
.msg.user .bubble { background: var(--accent-soft); border-color: rgba(79,140,255,0.35); }
.msg.error .bubble { border-color: rgba(255,92,108,0.5); color: var(--red); }
.typing { color: var(--text-dim); font-size: 13px; padding: 4px 2px; }
.typing .dots::after { content: "…"; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0.2; } }
#composer { border-top: 1px solid var(--border); padding: 12px 16px; background: var(--bg-panel); }
.composer-row { display: flex; gap: 10px; }
#input {
  flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 14px; font-size: 14px; outline: none; resize: none;
  font-family: inherit; line-height: 1.5; height: 46px;
}
#input:focus { border-color: var(--accent); }
button {
  background: var(--accent); color: #fff; border: none; border-radius: 8px;
  padding: 0 22px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.15s;
}
button:hover { opacity: 0.88; }
button:disabled { opacity: 0.45; cursor: not-allowed; }
.composer-hint { margin-top: 8px; font-size: 11.5px; color: var(--text-dim); }
#timeline { border-top: 1px solid var(--border); max-height: 30%; overflow-y: auto; background: var(--bg-panel); }
.step {
  display: flex; align-items: flex-start; gap: 10px; padding: 7px 16px;
  border-bottom: 1px solid rgba(38,49,77,0.5); font-size: 12.5px;
}
.step:last-child { border-bottom: none; }
.step .sym { width: 18px; text-align: center; font-weight: 700; flex-shrink: 0; }
.step .info { flex: 1; min-width: 0; }
.step .name { font-weight: 600; font-family: var(--mono); font-size: 12px; }
.step .desc { color: var(--text-dim); font-size: 11.5px; margin-top: 1px; }
.step .detail { color: var(--text-dim); font-size: 11.5px; margin-top: 2px; font-family: var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 80px; overflow-y: auto; }
.step.done .sym { color: var(--green); }
.step.failed .sym { color: var(--red); }
.step.running .sym { color: var(--yellow); animation: pulse 1s infinite; }
.step.skipped .sym { color: var(--text-dim); }
.step.pending .sym { color: var(--text-dim); }
@keyframes pulse { 50% { opacity: 0.4; } }
.modal-overlay {
  position: fixed; inset: 0; background: rgba(5,8,16,0.7); display: none;
  align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(2px);
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px;
  width: 420px; max-width: 92vw; padding: 20px;
}
.modal h3 { font-size: 15px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.modal h3 .warn-icon { color: var(--yellow); font-size: 18px; }
.modal .modal-body { color: var(--text-dim); font-size: 13px; line-height: 1.7; margin-bottom: 6px; }
.modal .modal-reason {
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; font-family: var(--mono); font-size: 12.5px; margin: 10px 0;
  color: var(--text); word-break: break-word;
}
.modal .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
.btn-ghost { background: var(--bg-hover); color: var(--text); }
.btn-danger { background: var(--red); }
#right {
  width: 320px; border-left: 1px solid var(--border); background: var(--bg-panel);
  display: flex; flex-direction: column; overflow-y: auto;
}
.tabs { display: flex; border-bottom: 1px solid var(--border); }
.tab {
  flex: 1; text-align: center; padding: 10px 0; cursor: pointer; font-size: 13px;
  color: var(--text-dim); border-bottom: 2px solid transparent; transition: all 0.15s;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-panel { display: none; padding: 14px 16px; }
.tab-panel.active { display: block; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; }
.field select, .field input {
  width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: 7px 10px; font-size: 13px; outline: none;
}
.field select:focus, .field input:focus { border-color: var(--accent); }
.save-btn { width: 100%; margin-top: 6px; }
.save-msg { font-size: 12px; margin-top: 8px; color: var(--green); text-align: center; min-height: 16px; }
.host-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.host-table th { text-align: left; color: var(--text-dim); font-weight: 600; padding: 5px 4px; border-bottom: 1px solid var(--border); }
.host-table td { padding: 6px 4px; border-bottom: 1px solid rgba(38,49,77,0.5); font-family: var(--mono); }
@media (max-width: 900px) { #right { display: none; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><span class="dot"></span>qssh <span>AI Agent</span></div>
    <div class="header-right">
      <span id="host-badge" class="badge">未选择主机</span>
      <span id="provider-badge" class="badge">…</span>
      <span id="perm-badge" class="badge">…</span>
    </div>
  </header>

  <main>
    <aside>
      <div class="panel-title">SSH 主机</div>
      <div class="host-list" id="host-list"></div>
    </aside>

    <section id="chat">
      <div id="messages"></div>
      <div id="timeline"></div>
      <div id="composer">
        <div class="composer-row">
          <textarea id="input" placeholder="输入指令，例如：查看服务器状态 / 重启 nginx 服务 / 查看最近日志…" rows="1"></textarea>
          <button id="send-btn">发送</button>
        </div>
        <div class="composer-hint">Enter 发送 · Shift+Enter 换行 · 危险操作会先请求你的确认</div>
      </div>
    </section>

    <div id="right">
      <div class="tabs">
        <div class="tab active" data-tab="settings">设置</div>
        <div class="tab" data-tab="hosts">主机</div>
      </div>
      <div class="tab-panel active" id="tab-settings">
        <div class="field">
          <label>Provider</label>
          <select id="cfg-provider">
            <option value="opencode">opencode-go（推荐）</option>
            <option value="openai">OpenAI 兼容</option>
            <option value="ollama">Ollama</option>
          </select>
        </div>
        <div class="field">
          <label>Base URL</label>
          <input id="cfg-baseurl" placeholder="https://opencode.ai/zen/go/v1">
        </div>
        <div class="field">
          <label>模型</label>
          <input id="cfg-model" placeholder="deepseek-v4-flash">
        </div>
        <div class="field">
          <label>权限模式</label>
          <select id="cfg-perm">
            <option value="ask_before_execute">执行前确认（默认）</option>
            <option value="read_only">只读</option>
            <option value="auto_safe">自动安全</option>
            <option value="full_access">完全访问</option>
          </select>
        </div>
        <div class="field">
          <label>超时（秒）</label>
          <input id="cfg-timeout" type="number" min="5" max="600">
        </div>
        <button class="save-btn" id="save-btn">保存设置</button>
        <div class="save-msg" id="save-msg"></div>
      </div>
      <div class="tab-panel" id="tab-hosts">
        <div id="hosts-table"></div>
      </div>
    </div>
  </main>
</div>

<!-- 审批确认弹窗 -->
<div class="modal-overlay" id="approval-modal">
  <div class="modal">
    <h3><span class="warn-icon">⚠</span> 需要确认</h3>
    <div class="modal-body" id="approval-desc"></div>
    <div class="modal-reason" id="approval-reason"></div>
    <div class="modal-actions">
      <button class="btn-ghost" id="approve-no">拒绝</button>
      <button class="btn-danger" id="approve-yes">批准执行</button>
    </div>
  </div>
</div>

<script>
/* ── State ── */
const state = {
  hosts: [],
  selectedAlias: null,
  history: [],
  busy: false,
  pendingToken: null,
};

/* ── Element refs ── */
const $ = (id) => document.getElementById(id);
const msgBox = $('messages');
const timelineBox = $('timeline');
const input = $('input');
const hostList = $('host-list');

/* ── Escape HTML ── */
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&', '<': '<', '>': '>', '"': '"', "'": ''',
  }[c]));
}

/* ── Status badges ── */
async function loadStatus() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    $('provider-badge').textContent = data.provider_label + ' · ' + data.model;
    $('provider-badge').className = 'badge ok';
    $('perm-badge').textContent = data.permission_label;
    $('perm-badge').className = 'badge';
    // 设置面板
    $('cfg-provider').value = data.provider;
    $('cfg-baseurl').value = data.base_url;
    $('cfg-model').value = data.model;
    $('cfg-perm').value = data.permission;
    $('cfg-timeout').value = data.timeout_secs;
  } catch (e) {
    $('provider-badge').textContent = '服务异常';
    $('provider-badge').className = 'badge err';
  }
}

/* ── Hosts ── */
async function loadHosts() {
  const res = await fetch('/api/hosts');
  const data = await res.json();
  state.hosts = data.hosts || [];
  if (state.hosts.length === 0) {
    hostList.innerHTML = '<div class="host-empty">未找到 SSH 主机。<br>请先在 ~/.ssh/config 中添加主机，或使用 <code>qssh add</code> 命令。</div>';
    return;
  }
  renderHosts();
  if (!state.selectedAlias) selectHost(state.hosts[0].alias);
}

function renderHosts() {
  hostList.innerHTML = state.hosts.map((h) => `
    <div class="host-item ${h.alias === state.selectedAlias ? 'active' : ''}" data-alias="${esc(h.alias)}">
      <div class="name">${esc(h.alias)}</div>
      <div class="sub">${esc(h.user)}@${esc(h.hostname)}:${h.port}</div>
    </div>`).join('');
  hostList.querySelectorAll('.host-item').forEach((el) => {
    el.addEventListener('click', () => selectHost(el.dataset.alias));
  });
}

function selectHost(alias) {
  state.selectedAlias = alias;
  renderHosts();
  const host = state.hosts.find((h) => h.alias === alias);
  $('host-badge').textContent = host ? `${host.user}@${host.hostname}` : alias;
  $('host-badge').className = 'badge ok';
}

/* ── Messages ── */
function addMessage(role, text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const avatar = role === 'user' ? '你' : 'AI';
  wrap.innerHTML = `
    <div class="avatar">${avatar}</div>
    <div class="bubble"></div>`;
  wrap.querySelector('.bubble').textContent = text;
  msgBox.appendChild(wrap);
  scrollBottom();
  return wrap;
}

function addError(text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg error';
  wrap.innerHTML = `<div class="avatar">!</div><div class="bubble"></div>`;
  wrap.querySelector('.bubble').textContent = text;
  msgBox.appendChild(wrap);
  scrollBottom();
}

function scrollBottom() { msgBox.scrollTop = msgBox.scrollHeight; }

/* ── Timeline ── */
function renderTimeline(timeline) {
  const steps = (timeline && timeline.steps) || [];
  if (steps.length === 0) {
    timelineBox.innerHTML = '';
    return;
  }
  timelineBox.innerHTML = steps.map((s) => `
    <div class="step ${s.status === '成功' ? 'done' : s.status === '失败' ? 'failed' : s.status === '执行中' ? 'running' : s.status === '跳过' ? 'skipped' : 'pending'}">
      <div class="sym">${esc(s.symbol)}</div>
      <div class="info">
        <div class="name">${esc(s.name)} <span style="color:var(--text-dim);font-weight:400">· ${esc(s.description)}</span></div>
        ${s.detail ? `<div class="detail">${esc(s.detail)}</div>` : ''}
      </div>
    </div>`).join('');
}

/* ── Approval modal ── */
function showApproval(evt) {
  state.pendingToken = evt.token;
  $('approval-desc').textContent = `工具 ${evt.tool} 请求执行：${evt.description}`;
  $('approval-reason').textContent = evt.reason;
  $('approval-modal').classList.add('show');
}

function hideApproval() {
  $('approval-modal').classList.remove('show');
  state.pendingToken = null;
}

async function sendApproval(approve) {
  const token = state.pendingToken;
  if (!token) return;
  hideApproval();
  try {
    await fetch('/api/approve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, approve }),
    });
  } catch (e) { /* 忽略 */ }
}
$('approve-yes').addEventListener('click', () => sendApproval(true));
$('approve-no').addEventListener('click', () => sendApproval(false));

/* ── Chat send ── */
async function send() {
  const message = input.value.trim();
  if (!message || state.busy) return;
  if (!state.selectedAlias) { addError('请先选择一个 SSH 主机'); return; }

  state.busy = true;
  $('send-btn').disabled = true;
  input.value = '';
  addMessage('user', message);

  // 追加 AI 气泡
  const aiMsg = addMessage('assistant', '');
  const bubble = aiMsg.querySelector('.bubble');
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = '<span class="dots">思考中</span>';
  bubble.appendChild(typing);

  let replyText = '';

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message,
        alias: state.selectedAlias,
        history: state.history,
      }),
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error || '请求失败');
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const events = buffer.split('\n\n');
      buffer = events.pop();
      for (const chunk of events) {
        if (!chunk.startsWith('data: ')) continue;
        const payload = JSON.parse(chunk.slice(6));
        handleEvent(payload, bubble, () => replyText);
      }
    }
  } catch (e) {
    bubble.textContent = replyText || '';
    addError(e.message || '请求失败');
  } finally {
    state.busy = false;
    $('send-btn').disabled = false;
    if (bubble.contains(typing)) bubble.removeChild(typing);
  }
}

function handleEvent(evt, bubble, getReply) {
  switch (evt.type) {
    case 'status':
      bubble.querySelector('.typing span') && (bubble.querySelector('.typing span').textContent = evt.status);
      break;
    case 'timeline':
      renderTimeline(evt.timeline);
      break;
    case 'approval':
      showApproval(evt);
      break;
    case 'finished':
      bubble.textContent = evt.reply || (getReply() || '（无回复）');
      if (evt.error) addError('错误: ' + evt.error);
      renderTimeline(evt.timeline);
      state.history.push({ role: 'user', content: input._lastMessage || '' });
      break;
  }
}

$('send-btn').addEventListener('click', send);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

/* ── Tabs ── */
document.querySelectorAll('.tab').forEach((tab) => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach((p) => p.classList.remove('active'));
    tab.classList.add('active');
    $('tab-' + tab.dataset.tab).classList.add('active');
  });
});

/* ── Save config ── */
async function saveConfig() {
  const body = {
    provider: $('cfg-provider').value,
    base_url: $('cfg-baseurl').value.trim(),
    model: $('cfg-model').value.trim(),
    permission: $('cfg-perm').value,
    timeout_secs: parseInt($('cfg-timeout').value, 10) || 60,
  };
  const res = await fetch('/api/config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  const msg = $('save-msg');
  if (data.ok) {
    msg.textContent = '✓ 已保存';
    loadStatus();
  } else {
    msg.textContent = '✗ ' + (data.error || '保存失败');
    msg.style.color = 'var(--red)';
  }
}
$('save-btn').addEventListener('click', saveConfig);

/* ── Init ── */
loadStatus();
loadHosts();
</script>
</body>
</html>
