<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick-SSH WebUI</title>
<style>
:root {
  --bg: #0f1420;
  --panel: #161d2e;
  --panel-2: #1c2538;
  --border: #28324a;
  --text: #e8edf6;
  --text-dim: #8a94ab;
  --accent: #4f8cff;
  --green: #34d399;
  --red: #f87171;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", system-ui, -apple-system, "Microsoft YaHei", sans-serif;
  min-height: 100vh;
}
header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
}
header h1 { font-size: 18px; font-weight: 600; }
.badge {
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--text-dim);
}
.badge.ok { color: var(--green); border-color: var(--green); }
.badge.err { color: var(--red); border-color: var(--red); }
main {
  max-width: 720px;
  margin: 0 auto;
  padding: 24px;
}
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
}
.panel h2 { font-size: 15px; margin-bottom: 16px; }
.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.field input, .field select {
  width: 100%;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--panel-2);
  color: var(--text);
  font-size: 14px;
  outline: none;
}
.field input:focus, .field select:focus { border-color: var(--accent); }
.actions { display: flex; gap: 12px; margin-top: 20px; align-items: center; }
.btn {
  padding: 10px 18px;
  border-radius: 8px;
  border: none;
  font-size: 14px;
  cursor: pointer;
  font-weight: 600;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { filter: brightness(1.1); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--accent); }
#save-msg { font-size: 13px; margin-left: 8px; }
.test-result {
  margin-top: 16px;
  padding: 14px 16px;
  border-radius: 8px;
  font-size: 13px;
  line-height: 1.6;
  display: none;
  border: 1px solid var(--border);
  background: var(--panel-2);
  white-space: pre-wrap;
  word-break: break-all;
}
.test-result.ok { color: var(--green); border-color: var(--green); }
.test-result.err { color: var(--red); border-color: var(--red); }
.key-hint {
  margin-top: 16px;
  font-size: 12px;
  color: var(--text-dim);
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
footer {
  text-align: center;
  padding: 20px;
  color: var(--text-dim);
  font-size: 12px;
}
</style>
</head>
<body>
<header>
  <h1>🖥️ Quick-SSH WebUI</h1>
  <span class="badge ok" id="provider-badge">加载中…</span>
  <span class="badge" id="perm-badge"></span>
</header>

<main>
  <div class="panel">
    <h2>Agent 配置</h2>

    <div class="field">
      <label>Provider（供应商）</label>
      <select id="cfg-provider">
        <option value="opencode">opencode-go（推荐）</option>
        <option value="openai">OpenAI Compatible</option>
        <option value="ollama">Ollama</option>
      </select>
    </div>

    <div class="field">
      <label>Base URL</label>
      <input id="cfg-baseurl" placeholder="https://api.openai.com/v1">
    </div>

    <div class="field">
      <label>Model</label>
      <input id="cfg-model" placeholder="模型名">
    </div>

    <div class="field">
      <label>权限级别</label>
      <select id="cfg-perm">
        <option value="ask_before_execute">执行前确认（默认）</option>
        <option value="read_only">只读</option>
        <option value="auto_safe">自动安全</option>
        <option value="full_access">完全访问</option>
      </select>
    </div>

    <div class="field">
      <label>请求超时（秒）</label>
      <input id="cfg-timeout" type="number" min="5" max="600">
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="test-btn">测试连接</button>
      <button class="btn btn-ghost" id="save-btn">保存配置</button>
      <span id="save-msg"></span>
    </div>

    <div class="test-result" id="test-result"></div>
    <div class="key-hint" id="key-hint"></div>
  </div>
</main>

<footer id="footer">Quick-SSH WebUI</footer>

<script>
const $ = (id) => document.getElementById(id);

async function loadStatus() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    $('provider-badge').textContent = data.provider_label;
    $('perm-badge').textContent = '权限: ' + data.permission_label;
    $('cfg-provider').value = data.provider;
    $('cfg-baseurl').value = data.base_url;
    $('cfg-model').value = data.model;
    $('cfg-perm').value = data.permission;
    $('cfg-timeout').value = data.timeout_secs;
    $('key-hint').textContent = '🔑 ' + data.key_hint;
    $('footer').textContent = 'Quick-SSH WebUI v' + data.version;
  } catch (e) {
    $('provider-badge').textContent = '服务异常';
    $('provider-badge').className = 'badge err';
  }
}

async function saveConfig() {
  const body = {
    provider: $('cfg-provider').value,
    base_url: $('cfg-baseurl').value.trim(),
    model: $('cfg-model').value.trim(),
    permission: $('cfg-perm').value,
    timeout_secs: parseInt($('cfg-timeout').value, 10) || 60,
  };
  const msg = $('save-msg');
  msg.textContent = '保存中…';
  try {
    const res = await fetch('/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (data.ok) {
      msg.textContent = '✓ 已保存';
      msg.style.color = '';
      loadStatus();
    } else {
      msg.textContent = '✗ ' + (data.error || '保存失败');
      msg.style.color = 'var(--red)';
    }
  } catch (e) {
    msg.textContent = '✗ 网络错误';
    msg.style.color = 'var(--red)';
  }
}

async function testConnection() {
  const btn = $('test-btn');
  const box = $('test-result');
  btn.disabled = true;
  btn.textContent = '测试中…';
  box.style.display = 'block';
  box.className = 'test-result';
  box.textContent = '正在连接 Provider，请稍候…';
  const body = {
    provider: $('cfg-provider').value,
    base_url: $('cfg-baseurl').value.trim(),
    model: $('cfg-model').value.trim(),
    timeout_secs: parseInt($('cfg-timeout').value, 10) || 60,
  };
  try {
    const res = await fetch('/api/test', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (data.ok) {
      box.className = 'test-result ok';
      box.textContent = '✓ 连接成功（耗时 ' + data.elapsed_ms + ' ms）\n\n模型回复：\n' + (data.reply || '（空回复）');
    } else {
      box.className = 'test-result err';
      box.textContent = '✗ 连接失败：\n' + (data.error || '未知错误');
    }
  } catch (e) {
    box.className = 'test-result err';
    box.textContent = '✗ 请求失败：' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = '测试连接';
  }
}

$('test-btn').addEventListener('click', testConnection);
$('save-btn').addEventListener('click', saveConfig);

loadStatus();
</script>
</body>
</html>
